name: Scrape Winnipeg court dates

# The real schedule lives in cron-job.org, which calls this workflow
# through the GitHub API. Those runs start immediately instead of
# queueing behind GitHub's shared cron.
#
# The crons below are a backup only, set 30 minutes behind the real
# schedule. If cron-job.org fired on time, the scraper sees a recent run
# and exits in a few seconds without touching the registry.
#
# Times are UTC and do not follow daylight saving. In summer:
#   10:40 UTC = 05:40 Winnipeg
#   14:40 UTC = 09:40 Winnipeg
#   17:40 UTC = 12:40 Winnipeg
#   20:40 UTC = 15:40 Winnipeg
#   23:40 UTC = 18:40 Winnipeg
on:
  schedule:
    - cron: "40 10 * * *"
    - cron: "40 14 * * *"
    - cron: "40 17 * * *"
    - cron: "40 20 * * *"
    - cron: "40 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Scrape even if one just ran"
        type: boolean
        default: false
      dry_run_alerts:
        description: "Log which emails would go out, send nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      # continue-on-error means a bad scrape still gets saved below.
      # The job is marked failed at the end so you get an email.
      - name: Run the scraper
        id: scrape
        continue-on-error: true
        env:
          FORCE_RUN: ${{ inputs.force }}
        run: python mb_court_dates.py

      - name: Save the data
        run: |
          git config user.name "courtready-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Data: ${{ github.run_id }}"
            git pull --rebase --autostash
            git push
          fi

      # Only runs when the scrape was healthy. The script also refuses to
      # act on a latest.json older than 90 minutes, so a failed scrape
      # cannot trigger email based on a stale picture.
      - name: Send alert emails
        if: steps.scrape.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          POSTMARK_FROM: ${{ secrets.POSTMARK_FROM }}
          POSTMARK_STREAM: ${{ secrets.POSTMARK_STREAM }}
          ALERTS_DRY_RUN: ${{ inputs.dry_run_alerts == true && '1' || '0' }}
        run: python send_alerts.py

      # Tells the watchdog the pipeline is alive. If this ping stops
      # arriving, healthchecks.io emails you.
      - name: Ping the watchdog
        if: steps.scrape.outcome == 'success'
        env:
          HC: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HC" ]; then
            curl -fsS -m 10 --retry 3 "$HC" > /dev/null
            echo "Watchdog pinged."
          else
            echo "No HEALTHCHECK_URL secret set, skipping."
          fi

      - name: Flag problems
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "The scraper reported a problem. Check the log above."
          exit 1
